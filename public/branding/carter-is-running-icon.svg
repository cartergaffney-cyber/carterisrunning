<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#D62839"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- motion arcs -->
  <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M 70 210 Q 40 230 70 250"/>
    <path d="M 95 175 Q 55 205 95 235"/>
  </g>

  <!-- runner pictogram -->
  <g stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- back arm -->
    <path d="M 288 168 L 336 146 L 366 184"/>
    <!-- front arm -->
    <path d="M 288 168 L 246 196 L 216 156"/>
    <!-- torso -->
    <path d="M 300 152 L 252 258"/>
    <!-- front leg, driving forward and up -->
    <path d="M 252 258 L 300 312 L 264 378"/>
    <!-- back leg, extended behind -->
    <path d="M 252 258 L 196 232 L 150 268"/>
  </g>

  <!-- head -->
  <circle cx="300" cy="112" r="30" fill="#FFFFFF"/>
</svg>
